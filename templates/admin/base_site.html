{% extends "admin/base.html" %}
{% load i18n %}

{% block extrastyle %}
<style>
    :root {
        --primary: #0f172a;
        --secondary: #d97706;
        --accent: #d97706;
        --header-bg: #0f172a;
        --header-link: #d97706;
        --link-fg: #d97706;
        --link-hover-color: #b45309;
        --button-bg: #d97706;
        --button-hover-bg: #b45309;
        --default-button-bg: #0f172a;
        --default-button-hover-bg: #1e293b;
    }
    #header { background: #0f172a; border-bottom: 3px solid #d97706; }
    #branding h1 a { font-weight: 700; letter-spacing: 1px; }
    #branding h1 a span { color: #d97706; }
    .module caption { background: #0f172a; }
    div.breadcrumbs { background: #1e293b; }
    a:link, a:visited { color: #d97706; }
    a:hover { color: #b45309; }
    .button, input[type=submit], input[type=button], .submit-row input, a.button {
        background: #d97706;
    }
    .button:hover, input[type=submit]:hover, input[type=button]:hover {
        background: #b45309;
    }
    .button.default, input[type=submit].default, .submit-row input.default {
        background: #0f172a;
    }
    .button.default:hover, input[type=submit].default:hover {
        background: #1e293b;
    }
    .paginator a:link, .paginator a:visited { color: #d97706; }
</style>
{% endblock %}

{% block branding %}
<div style="display:flex;align-items:center;justify-content:space-between;">
    <h1 id="site-name"><a href="{% url 'home' %}" style="color:white;text-decoration:none;">CACD <span style="color:#d97706;">Soluciones</span></a></h1>
    <a href="{% url 'home' %}" style="color:#ccc;font-size:13px;text-decoration:none;">← Volver al inicio</a>
</div>
{% endblock %}
