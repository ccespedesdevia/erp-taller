<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center" style="margin-top:15vh;">
            <div class="col-md-6 text-center">
                <h1 class="display-4 mb-1">ERP Taller</h1>
                <p class="text-muted mb-5">Sistema de gestión de tickets</p>

                <div class="d-grid gap-3">
                    <a href="{% url 'admin:index' %}" class="btn btn-dark btn-lg py-3">
                        <strong>Portal del Técnico</strong><br>
                        <small class="text-light-emphasis">Admin — Tickets, clientes, repuestos</small>
                    </a>
                    <a href="{% url 'portal_solicitar' %}" class="btn btn-success btn-lg py-3">
                        <strong>Solicitar Servicio</strong><br>
                        <small>Crear ticket sin login — por RUT</small>
                    </a>
                    <a href="{% url 'portal_login' %}" class="btn btn-primary btn-lg py-3">
                        <strong>Portal del Cliente</strong><br>
                        <small>Ingresar con RUT</small>
                    </a>
                    <a href="{% url 'portal_seguir' %}" class="btn btn-outline-secondary btn-lg py-3">
                        <strong>Seguimiento de Tickets</strong><br>
                        <small>Consultar por código — sin login</small>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
