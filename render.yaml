version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: erp-taller
      runtime: python
      repo: https://github.com/ccespedesdevia/erp-taller
      plan: free
      envVars:
      - key: SECRET_KEY
        sync: false
      region: oregon
      buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
      startCommand: gunicorn erp.wsgi --env DJANGO_SETTINGS_MODULE=erp.settings_prod
      autoDeployTrigger: commit
